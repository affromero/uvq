[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mappingquality-uvq"
version = "1.5.0"
description = "Packaged Google Universal Video Quality 1.5 inference"
readme = "uvq1p5_pytorch/README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
  "numpy>=2,<3",
  "torch>=2.8,<3",
  "torchvision>=0.23,<1",
]

[tool.hatch.build.targets.wheel]
include = ["/uvq1p5_pytorch", "/utils"]

[tool.hatch.build.targets.wheel.sources]
"uvq1p5_pytorch" = "google_uvq/uvq1p5_pytorch"
"utils" = "google_uvq/utils"

[tool.hatch.build.targets.sdist]
include = ["/uvq1p5_pytorch", "/utils", "/LICENSE"]
